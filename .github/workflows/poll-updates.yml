name: Poll project updates
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: poll-updates
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/poll-updates.mjs
      - name: Commit and deploy new updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- src/data/updates.json src/assets/devlog)" ]; then
            echo "No new updates."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/data/updates.json src/assets/devlog
          git commit -m "Update project changelogs and Bluesky posts"
          git push
          # Pushes made with the workflow token don't trigger other workflows, so start the deploy directly.
          gh workflow run deploy.yml --ref main
